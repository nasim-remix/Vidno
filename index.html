
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>محمد محبی | صفحه رسمی و معرفی شخصی</title>

  <meta name="description"
        content="صفحه شخصی محمد محبی؛ معرفی، تصویر پروفایل و اطلاعات عمومی.">

  <meta name="robots" content="index, follow">
  <meta name="author" content="محمد محبی">
  <meta name="theme-color" content="#eaf5ff">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="محمد محبی">
  <meta property="og:description"
        content="صفحه شخصی محمد محبی و تصویر پروفایل">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:image" content="profile.jpg">

  <link rel="icon" href="profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      color: #18324d;
      background:
        radial-gradient(circle at top left, #d9edff, transparent 45%),
        linear-gradient(135deg, #f8fcff, #eaf5ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .profile-card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 38px 25px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d8eaff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(53, 117, 174, 0.12);
    }

    .avatar {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid #e5f3ff;
      box-shadow: 0 8px 28px rgba(44, 128, 201, 0.18);
      background: #edf7ff;
    }

    h1 {
      margin: 24px 0 8px;
      font-size: 32px;
      font-weight: 800;
      color: #1769aa;
    }

    .subtitle {
      color: #678098;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .description {
      line-height: 2.1;
      font-size: 16px;
      color: #415a72;
      margin: 20px auto;
    }

    .tag {
      display: inline-block;
      background: #eaf5ff;
      color: #1769aa;
      border: 1px solid #d4eaff;
      padding: 9px 16px;
      border-radius: 30px;
      font-size: 13px;
      margin: 4px;
    }

    footer {
      border-top: 1px solid #e6f0fa;
      padding-top: 20px;
      margin-top: 28px;
      color: #8396a9;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 30px 18px;
      }

      .avatar {
        width: 150px;
        height: 150px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "محمد محبی",
    "alternateName": "Mohammad Mohabi",
    "description": "صفحه شخصی و تصویر پروفایل محمد محبی",
    "image": "profile.jpg"
  }
  </script>
</head>

<body>
  <main class="profile-card">
    <img
      class="avatar"
      src="profile.jpg"
      alt="عکس پروفایل محمد محبی"
      width="180"
      height="180"
      fetchpriority="high"
    >

    <h1>محمد محبی</h1>

    <p class="subtitle">صفحه شخصی و معرفی</p>

    <p class="description">
      به صفحه شخصی من خوش آمدید.
      این صفحه برای معرفی و نمایش تصویر پروفایل محمد محبی ساخته شده است.
    </p>

    <div>
      <span class="tag">محمد محبی</span>
      <span class="tag">صفحه شخصی</span>
      <span class="tag">تصویر پروفایل</span>
    </div>

    <footer>
      © محمد محبی — صفحه شخصی
    </footer>
  </main>
</body>
</html>
